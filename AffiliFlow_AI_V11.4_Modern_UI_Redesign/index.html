<body>

  <header class="container">
    <h1>AffiliFlow <span>AI</span></h1>
    <p>Smart Affiliate Video Studio — Jana Idea, Copywriting & Prompt Video dalam satu klik.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Maklumat Produk & Pencipta</h2>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div>
          <label for="creatorName">Nama Pencipta / Jenama</label>
          <input type="text" id="creatorName" placeholder="Cth: Ahmad Affiliate">
        </div>
        <div>
          <label for="price">Harga Produk (RM)</label>
          <input type="text" id="price" placeholder="Cth: 49.90">
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label for="productDescription">Penerangan Produk / Niche</label>
        <textarea id="productDescription" rows="3" placeholder="Cth: Serum Vitamin C untuk kulit kusam..."></textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div>
          <label for="target">Sasaran Audiens</label>
          <input type="text" id="target" placeholder="Cth: Wanita 25-40 tahun">
        </div>
        <div>
          <label for="points">3 Poin Jualan Utama</label>
          <input type="text" id="points" placeholder="Cth: Pantas, Murah, Berkesan">
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label for="affiliateUrl">Pautan Affiliate (Wajib)</label>
        <input type="url" id="affiliateUrl" placeholder="https://...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <div>
          <label for="style">Gaya Penulisan</label>
          <select id="style">
            <option value="santai">Santai & Mesra</option>
            <option value="profesional">Profesional</option>
            <option value="mendesak">Mendesak (Urgent)</option>
          </select>
        </div>
        <div>
          <label for="videoStyle">Gaya Video</label>
          <select id="videoStyle">
            <option value="cinematic">Cinematic</option>
            <option value="ugc">UGC (User Generated)</option>
            <option value="animasi">Animasi Ringkas</option>
          </select>
        </div>
        <div>
          <label for="sceneType">Jenis Adegan</label>
          <select id="sceneType">
            <option value="realistik">Realistik</option>
            <option value="studio">Latar Studio</option>
            <option value="luaran">Luaran (Outdoor)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="btn primary" data-act="generate-tab" data-tab="story">📝 Jana Tab 1: Story</button>
        <button class="btn primary" data-act="generate-tab" data-tab="problem">🧩 Jana Tab 2: 6 Post</button>
        <button class="btn primary" data-act="generate-tab" data-tab="video">🎬 Jana Tab 3: Video</button>
      </div>
      
      <div id="intelStatus" style="margin-top: 16px; font-size: 0.9rem; color: var(--muted);"></div>
    </section>

    <section id="results" class="card" style="min-height: 200px;">
      <div style="text-align: center; color: var(--muted); padding: 40px 0;">
        <p>Hasil penjanaan AI akan muncul di sini mengikut tab yang dipilih.</p>
      </div>
    </section>
  </main>

  <footer class="container" style="text-align: center; padding: 40px 0; color: var(--muted); font-size: 0.85rem;">
    <nav style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">

      <a href="terms.html">Terma</a>
    </nav>
    <p>&copy; 2026 AffiliFlow AI. Hak cipta terpelihara.</p>
  </footer>

  <div id="toast" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999;"></div>

  <script defer src="app.js"></script>
